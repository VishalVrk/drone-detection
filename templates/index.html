<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOLOv5 Webcam Detection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-b from-gray-100 to-gray-200 flex flex-col items-center justify-center min-h-screen p-4">
  <div class="w-full max-w-lg bg-white rounded-xl shadow-lg p-6 space-y-6">
    <div class="flex items-center justify-center space-x-3 mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <h1 class="text-3xl font-bold text-gray-800">YOLOv5 Detection</h1>
    </div>

    <!-- Relative container for video and canvas overlay -->
    <div class="relative w-full rounded-lg overflow-hidden shadow-md border-2 border-gray-200">
      <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
      <canvas id="canvas" class="absolute top-0 left-0 w-full h-full"></canvas>
      
      <!-- Loading indicator -->
      <div id="loading" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50">
        <div class="text-white flex flex-col items-center">
          <svg class="animate-spin h-10 w-10 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Connecting to camera...</span>
        </div>
      </div>
    </div>

    <!-- Status panel -->
    <div class="flex justify-between items-center p-4 bg-gray-50 rounded-lg border border-gray-200">
      <div class="flex items-center space-x-3">
        <div id="status-indicator" class="w-3 h-3 rounded-full bg-gray-400"></div>
        <div class="font-medium text-gray-700">Status:</div>
        <div id="status" class="font-semibold text-gray-900">Not Detected</div>
      </div>
      <div class="text-sm text-gray-500" id="fps">0 FPS</div>
    </div>

    <div class="text-center text-sm text-gray-500">
      Point your camera at objects to detect them
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const statusIndicator = document.getElementById('status-indicator');
    const loading = document.getElementById('loading');
    const fpsElement = document.getElementById('fps');
    
    let lastFrameTime = 0;
    let frameCount = 0;
    let lastFpsUpdate = 0;

    async function setupWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          } 
        });
        video.srcObject = stream;
        return new Promise(res => video.onloadedmetadata = () => {
          loading.classList.add('hidden');
          res(video);
        });
      } catch (error) {
        console.error('Error accessing camera:', error);
        loading.innerHTML = `
          <div class="text-white text-center p-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-red-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <p class="text-lg font-semibold">Camera access denied</p>
            <p class="mt-2">Please allow camera access and refresh the page</p>
          </div>
        `;
      }
    }

    function updateFPS() {
      const now = performance.now();
      frameCount++;
      
      if (now - lastFpsUpdate >= 1000) { // Update FPS every second
        const fps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
        fpsElement.textContent = `${fps} FPS`;
        
        frameCount = 0;
        lastFpsUpdate = now;
      }
    }

    async function sendFrame() {
      // Sync canvas size to video
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      // Clear and draw video frame
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      try {
        // Send frame to backend
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
        const form = new FormData();
        form.append('image', blob, 'frame.jpg');

        const res = await fetch('/detect', { method: 'POST', body: form });
        const detections = await res.json();
        
        // Log ALL detections to see full structure
        console.log("All detections:", detections);

        // Update status
        const detected = detections.length > 0;
        status.innerText = detected ? 'Detected' : 'Not Detected';
        
        // Update status indicator color
        statusIndicator.className = detected 
          ? 'w-3 h-3 rounded-full bg-green-500 animate-pulse' 
          : 'w-3 h-3 rounded-full bg-gray-400';

        // Draw boxes with improved style
        ctx.lineWidth = 3;
        ctx.font = 'bold 16px Inter, system-ui, sans-serif';
        
        // Draw the rectangles directly from received data
        detections.forEach(det => {
          try {
            // Log each detection for debugging
            console.log("Processing detection:", det);
            
            // Get bounding box coordinates - try all possible formats
            let xmin, ymin, xmax, ymax, confidence, name;
            
            // Direct properties
            if (det.xmin !== undefined && det.ymin !== undefined && 
                det.xmax !== undefined && det.ymax !== undefined) {
              xmin = Number(det.xmin);
              ymin = Number(det.ymin);
              xmax = Number(det.xmax);
              ymax = Number(det.ymax);
            } 
            // Bbox array format [x, y, width, height]
            else if (det.bbox && Array.isArray(det.bbox)) {
              xmin = Number(det.bbox[0]);
              ymin = Number(det.bbox[1]);
              xmax = xmin + Number(det.bbox[2]);
              ymax = ymin + Number(det.bbox[3]);
            }
            // Explicit x1,y1,x2,y2 format
            else if (det.x1 !== undefined && det.y1 !== undefined &&
                     det.x2 !== undefined && det.y2 !== undefined) {
              xmin = Number(det.x1);
              ymin = Number(det.y1);
              xmax = Number(det.x2);
              ymax = Number(det.y2);
            }
            // Unknown format
            else {
              console.error("Unknown detection format:", det);
              return; // Skip this detection
            }
            
            confidence = det.confidence || det.score || 0;
            name = det.name || det.class_name || det.class || "";
            
            // Additional debug information
            console.log(`Drawing box at: (${xmin},${ymin}) to (${xmax},${ymax})`);
            
            const boxWidth = xmax - xmin;
            const boxHeight = ymax - ymin;
          
          // Create gradient for box outline
          const gradient = ctx.createLinearGradient(xmin, ymin, xmax, ymax);
          gradient.addColorStop(0, '#3b82f6');
          gradient.addColorStop(1, '#8b5cf6');
          ctx.strokeStyle = gradient;
          
          // Draw main box
          ctx.strokeRect(xmin, ymin, boxWidth, boxHeight);
          
          // Draw label background
          const label = `${name} ${(confidence*100).toFixed(1)}%`;
          const textMetrics = ctx.measureText(label);
          const textWidth = textMetrics.width + 10;
          const textHeight = 24;
          
          ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.fillRect(
            xmin - 1, 
            ymin - textHeight - 1,
            textWidth + 2,
            textHeight + 2
          );
          
          // Draw label text
          ctx.fillStyle = '#ffffff';
          ctx.fillText(
            label,
            xmin + 5,
            ymin - 7
          );
          } catch (error) {
            console.error("Error drawing detection:", error);
          }
        });
        
        updateFPS();
      } catch (error) {
        console.error('Error in detection:', error);
      }

      requestAnimationFrame(sendFrame);
    }

    // Start everything
    setupWebcam().then(() => {
      lastFpsUpdate = performance.now();
      requestAnimationFrame(sendFrame);
    });
  </script>
</body>
</html>
