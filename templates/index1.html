<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Drone Detection System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-title {
            background: linear-gradient(90deg, #3490dc, #6574cd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .control-panel {
            border-left: 2px solid #4a5568;
        }
        .detection-box {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-12">
            <h1 class="text-4xl font-bold text-center gradient-title tracking-tight mb-2">Drone Detection System</h1>
            <div class="flex items-center justify-center">
                <div class="h-px bg-blue-500 w-16"></div>
                <p class="text-center text-blue-400 mx-4 font-medium uppercase tracking-wider text-sm">YOLOv5 Precision Detection</p>
                <div class="h-px bg-blue-500 w-16"></div>
            </div>
        </header>

        <div class="max-w-4xl mx-auto mb-8">
            <div class="bg-gray-800 rounded-lg p-6 detection-box border border-gray-700">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-semibold text-blue-300">Live Detection Feed</h2>
                    <span class="bg-green-500 text-xs px-2 py-1 rounded-full text-green-900 font-semibold">ACTIVE</span>
                </div>
                <div class="relative">
                    <img id="videoFeed" src="/video_feed" class="w-full rounded-lg bg-black shadow-lg">
                    <div class="absolute top-4 right-4 bg-black bg-opacity-60 px-3 py-1 rounded-md text-xs font-mono">
                        YOLO v5 • <span class="text-green-400">MONITORING</span>
                    </div>
                </div>
                <div class="mt-6 flex justify-between items-center">
                    <p class="text-gray-400 text-sm">Advanced neural network processing with custom-trained drone identification model</p>
                    <div class="flex space-x-2">
                        <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                        <div class="text-xs text-gray-300">Processing Active</div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="text-center text-gray-500 text-xs mt-8">
            <p>© 2025 Advanced Drone Detection Systems</p>
        </footer>
    </div>
</body>
</html>
